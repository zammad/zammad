query ticketWithMentionLimit($ticketId: ID!, $mentionsCount: Int = null) {
  ticket(ticketId: $ticketId) {
    ...ticketAttributes
    aiSummaryEnabled
    createArticleType {
      id
      name
    }
    mentions(first: $mentionsCount) {
      totalCount
      edges {
        node {
          ...ticketMention
        }
        cursor
      }
    }
    checklist {
      id
      completed
      incomplete
      total
      complete
    }
    referencingChecklistTickets {
      ...referencingTicket
    }
  }
}
