fragment knowledgeBaseAnswerTranslation on KnowledgeBaseAnswerTranslation {
  id
  title
  visibility
  content {
    bodyExcerpt
  }
  answer {
    id
    archivedAt
    publishedAt
    category {
      id
      title
      knowledgeBase {
        id
      }
    }
  }
  kbLocale {
    systemLocale {
      locale
      name
    }
  }
}
