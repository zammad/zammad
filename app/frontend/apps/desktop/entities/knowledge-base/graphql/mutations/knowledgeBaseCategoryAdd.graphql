mutation knowledgeBaseCategoryAdd(
  $knowledgeBaseId: ID!
  $input: KnowledgeBaseCategoryInput!
  $locale: String!
) {
  knowledgeBaseCategoryAdd(knowledgeBaseId: $knowledgeBaseId, input: $input, locale: $locale) {
    # The same field set the browse grid lists, so the created category normalizes into
    #   the cache as a complete record instead of a partial one.
    category {
      id
      title
      categoryIcon
      visibility
      translationMissing
      answerCount
      subcategoryCount
      position
      isDeletable
      ...knowledgeBaseCategoryPolicy
      ...knowledgeBaseCategoryPreInfo
    }
    errors {
      ...errors
    }
  }
}
