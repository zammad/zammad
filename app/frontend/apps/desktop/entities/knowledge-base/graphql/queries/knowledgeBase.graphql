query knowledgeBase($locale: String) {
  knowledgeBase(locale: $locale) {
    id
    # Its texts in this locale, resolved from the translation that owns them.
    translation(locale: $locale) {
      id
      title
      footerNote
    }
    iconset
    isPubliclyAvailable
    isVisiblePublicly(locale: $locale)
    # The root lists categories and nothing else, so it carries this one mode — the order its
    #   top level categories are browsed in, and what the sorting bar starts from there.
    categorySortingMode
    # Editor access to the knowledge base itself, which is what gates adding a top level
    #   category (its parent is the knowledge base).
    policy {
      update
    }
    showFeedIcon
    kbLocales {
      id
      primary
      systemLocale {
        id
        locale
        name
      }
    }
    currentLocale(locale: $locale) {
      id
      systemLocale {
        id
        locale
      }
    }
  }
}
