query knowledgeBaseAnswers(
  $categoryId: ID!
  $locale: String
  $pageSize: Int = 30
  $cursor: String
  # Set only while the sorting bar previews a mode, like the category listing's own argument.
  $sortingMode: EnumKnowledgeBaseSortingMode
) {
  knowledgeBaseAnswers(
    categoryId: $categoryId
    locale: $locale
    first: $pageSize
    after: $cursor
    sortingMode: $sortingMode
  ) {
    totalCount
    edges {
      node {
        id
        visibility
        position
        # What the answer's own header opens from before its query resolves - the same role the
        #   grid's `knowledgeBaseCategoryPreInfo` plays for a category. Spread rather than relied on
        #   through the fields below, so the header's cache read cannot be broken by editing them.
        ...knowledgeBaseAnswerPreInfo
        translation(locale: $locale) {
          id
          title
          kbLocale {
            id
            systemLocale {
              locale
            }
          }
        }
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
