query knowledgeBaseAnswers(
  $categoryId: ID!
  $locale: String
  $pageSize: Int = 30
  $cursor: String
  # Set only while the sorting bar previews a mode, like the category listing's own argument.
  $sortingMode: EnumKnowledgeBaseSortingMode
) {
  knowledgeBaseAnswers(
    categoryId: $categoryId
    locale: $locale
    first: $pageSize
    after: $cursor
    sortingMode: $sortingMode
  ) {
    totalCount
    edges {
      node {
        id
        visibility
        position
        translation(locale: $locale) {
          id
          title
          kbLocale {
            id
            systemLocale {
              locale
            }
          }
        }
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
