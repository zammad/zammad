query userCurrentRecentCloseList($limit: Int) {
  userCurrentRecentCloseList(limit: $limit) {
    __typename
    ... on Ticket {
      id
      internalId
      title
      number
      state {
        id
        name
      }
      priority {
        id
        name
        defaultCreate
        uiColor
      }
      stateColorCode
    }
    ... on User {
      id
      internalId
      fullname
      active
    }
    ... on Organization {
      id
      internalId
      name
      active
    }
  }
}
