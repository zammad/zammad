query quickSearch($search: String!, $limit: Int = 10) {
  quickSearchOrganizations: search(search: $search, onlyIn: Organization, limit: $limit) {
    totalCount
    items {
      __typename
      ... on Organization {
        id
        internalId
        name
        active
      }
    }
  }
  quickSearchTickets: search(search: $search, onlyIn: Ticket, limit: $limit) {
    totalCount
    items {
      __typename
      ... on Ticket {
        id
        internalId
        title
        number
        state {
          id
          name
        }
        stateColorCode
      }
    }
  }
  quickSearchKnowledgeBaseAnswers: search(
    search: $search
    onlyIn: KnowledgeBase__Answer__Translation
    limit: $limit
  ) {
    totalCount
    items {
      __typename
      ... on KnowledgeBaseAnswerTranslation {
        id
        title
        visibility
        kbLocale {
          systemLocale {
            locale
          }
        }
        answer {
          id
          # Only the id, and only for the public help-site link the users who cannot open the
          # agent answer view are sent to - see getKnowledgeBaseAnswerLink.
          category {
            id
          }
        }
      }
    }
  }
  quickSearchUsers: search(search: $search, onlyIn: User, limit: $limit) {
    totalCount
    items {
      __typename
      ... on User {
        id
        internalId
        fullname
        active
      }
    }
  }
}
