query quickSearch($search: String!, $onlyIn: [EnumSearchableModels!]!, $limit: Int = 10) {
  searchGrouped(search: $search, onlyIn: $onlyIn, limit: $limit) {
    model
    totalCount
    items {
      __typename
      ... on Ticket {
        id
        internalId
        title
        number
        state {
          id
          name
        }
        stateColorCode
      }
      ... on User {
        id
        internalId
        fullname
        active
      }
      ... on Organization {
        id
        internalId
        name
        active
      }
      ... on KnowledgeBaseAnswerTranslation {
        id
        title
        visibility
        kbLocale {
          systemLocale {
            locale
          }
        }
        answer {
          id
          # Only the id, and only for the public help-site link the users who cannot open the
          # agent answer view are sent to - see getKnowledgeBaseAnswerLink.
          category {
            id
          }
        }
      }
    }
  }
}
