mutation ticketExternalReferencesSnipeitAssetAdd ($snipeitAssetIds: [Int!]!, $ticketId: ID) {
    ticketExternalReferencesSnipeitAssetAdd(snipeitAssetIds: $snipeitAssetIds, ticketId: $ticketId) {
      snipeitAssets {
       ...SnipeitAssetAttributes
      }
      errors {
        ...errors
      }
    }
}
