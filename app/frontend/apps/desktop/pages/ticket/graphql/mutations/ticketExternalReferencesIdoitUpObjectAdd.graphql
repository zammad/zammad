mutation ticketExternalReferencesIdoitUpObjectAdd ($idoitUpObjectIds: [String!]!, $ticketId: ID) {
    ticketExternalReferencesIdoitUpObjectAdd(idoitUpObjectIds: $idoitUpObjectIds, ticketId: $ticketId) {
      idoitUpObjects {
       ...IdoitUpObjectAttributes
      }
      errors {
        ...errors
      }
    }
}
