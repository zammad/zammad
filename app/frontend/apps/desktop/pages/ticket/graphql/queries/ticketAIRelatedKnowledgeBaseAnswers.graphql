query ticketAIRelatedKnowledgeBaseAnswers(
  $ticketId: ID!
  $includeDraftsAndArchived: Boolean
  $includeLinkedAnswers: Boolean
) {
  ticketAIRelatedKnowledgeBaseAnswers(
    ticketId: $ticketId
    includeDraftsAndArchived: $includeDraftsAndArchived
    includeLinkedAnswers: $includeLinkedAnswers
  ) {
    pending
    answers {
      score
      translation {
        ...knowledgeBaseAnswerTranslation
      }
    }
  }
}
