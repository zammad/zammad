query todaysTickets {
  todaysTickets {
    id
    number
    title
    stateColorCode
    state {
      id
      name
    }
    priority {
      id
      name
      uiColor
    }
    customer {
      id
      fullname
      email
    }
    owner {
      id
      fullname
    }
    group {
      id
      name
    }
    createdAt
    updatedAt
  }
}