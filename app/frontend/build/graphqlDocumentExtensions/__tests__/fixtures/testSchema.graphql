# Minimal schema fixture: union-returning search fields, mirroring the shape
# of the real `search` query (SearchResult.items: [Item!]!) and of the grouped
# quick search field (one group per model, each with its own union `items`).

type Query {
  search(search: String!, limit: Int): SearchResult
  searchGrouped(search: String!, onlyIn: [SearchableModels!]!, limit: Int): [SearchGroup!]!
}

type SearchResult {
  totalCount: Int
  items: [Item!]!
}

type SearchGroup {
  model: SearchableModels!
  totalCount: Int!
  items: [Item!]!
}

enum SearchableModels {
  Ticket
  User
  AddonProject
}

union Item = Ticket | User | AddonProject

type Ticket {
  id: ID!
  title: String
}

type User {
  id: ID!
  fullname: String
}

# Stands in for a searchable type an add-on registers on the backend.
type AddonProject {
  id: ID!
  name: String
}

# A real schema type that is deliberately NOT a member of the `Item` union,
# so a fragment on it can never match any selection set (dead-extension case).
type Organization {
  id: ID!
  name: String
}
