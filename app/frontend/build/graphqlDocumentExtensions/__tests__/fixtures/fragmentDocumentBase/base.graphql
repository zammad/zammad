# A fragment-only base document (no operation), mirroring the shared taskbar
# fragment `userCurrentTaskbarItemAttributes.graphql`: the union-typed
# selection sits inside a fragment that operations import cross-file.

fragment resultAttributes on SearchResult {
  totalCount
  items {
    __typename
    ... on Ticket {
      id
    }
  }
}
