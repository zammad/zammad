# The same pages as the articles query, reduced to the translation flag: answers for a new target
# language without transferring the article bodies again.
query ticketArticlesTranslationAvailability(
  $ticketId: ID!
  $pageSize: Int
  $loadFirstArticles: Boolean = true
  $firstArticlesCount: Int = 1
  $translationTargetLocale: String!
) {
  firstArticles: ticketArticles(ticketId: $ticketId, first: $firstArticlesCount)
    @include(if: $loadFirstArticles) {
    edges {
      node {
        id
        translationAvailable(targetLocale: $translationTargetLocale)
      }
    }
  }
  articles: ticketArticles(ticketId: $ticketId, last: $pageSize) {
    edges {
      node {
        id
        translationAvailable(targetLocale: $translationTargetLocale)
      }
    }
  }
}
