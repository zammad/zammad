mutation ticketArticleTranslate(
  $articleId: ID!
  $targetLocale: String!
  $force: Boolean
  $regenerationOfId: ID
) {
  ticketArticleTranslate(
    articleId: $articleId
    targetLocale: $targetLocale
    force: $force
    regenerationOfId: $regenerationOfId
  ) {
    article {
      ...ticketArticleTranslation
    }
    translation {
      translated
    }
    analytics {
      run {
        id
      }
      usage {
        userHasProvidedFeedback
      }
    }
  }
}
