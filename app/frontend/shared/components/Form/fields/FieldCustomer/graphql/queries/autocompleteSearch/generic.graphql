query autocompleteSearchGeneric($input: AutocompleteSearchGenericInput!, $membersCount: Int = 10) {
  autocompleteSearchGeneric(input: $input) {
    value
    label
    labelPlaceholder
    heading
    headingPlaceholder
    disabled
    object {
      __typename
      ... on User {
        id
        internalId
        login
        image
        firstname
        lastname
        fullname
        email
        phone
        outOfOffice
        outOfOfficeStartAt
        outOfOfficeEndAt
        active
        vip
        organization {
          __typename
          id
          internalId
          name
          active
          vip
          ticketsCount {
            open
            closed
          }
        }
        hasSecondaryOrganizations
      }
      ... on Organization {
        id
        internalId
        name
        active
        vip
        allMembers(first: $membersCount) {
          edges {
            node {
              __typename
              id
              internalId
              login
              image
              firstname
              lastname
              fullname
              email
              phone
              outOfOffice
              outOfOfficeStartAt
              outOfOfficeEndAt
              active
              vip
              hasSecondaryOrganizations
            }
          }
        }
      }
    }
  }
}
