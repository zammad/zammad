'disable squash for weblate MRs':
  stage: automate
  image:
    name: alpine/curl:latest
    entrypoint: ['']
  cache: []
  rules:
    - !reference [.job_rules, main_repository_only]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /weblate-merge$/ && $CI_MERGE_REQUEST_SQUASH_ON_MERGE == "true"'
  before_script: []
  script:
    - echo "⚠️ Disabling squash option for this MR..."
    - |
      curl --fail-with-body --request PUT --header "PRIVATE-TOKEN: ${WEBLATE_ACCESS_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}?squash=false"
    - echo "✅ Squash option successfully disabled via API."
  after_script: []

# This job will create commits in pipelines pushed from Weblate.
# It re-generates the catalog, and any additional files such as view templates and chat assets.
'push translations update commit':
  stage: automate
  rules:
    - !reference [.job_rules, main_repository_only]
    # Don't apply job filter here.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_MESSAGE =~ /Translations update from translations[.]zammad[.]org/
      when: always
    - when: never
  cache:
    - !reference [.cache, read_only_ruby]
    - !reference [.cache, read_only_nodejs]
  services:
    - !reference [.services, postgresql]
  before_script:
    - !reference [.scripts, source_rvm]
    - !reference [.scripts, bundle_install]
    - !reference [.scripts, configure_environment]
    - !reference [.scripts, zammad_db_init]
    - !reference [.scripts, pnpm_install_chat]
  variables:
    ZAMMAD_SAFE_MODE: 1
  script:
    - bundle exec rails generate zammad:translation_catalog --full
    - pnpm --dir public/assets/chat exec gulp build
    - git status
    - git config user.email "noreply@weblate.org"
    - git config user.name "Weblate"
    # Pushing via CI_JOB_TOKEN does not trigger another pipeline, so use a dedicated token.
    - git remote add gitlab_origin https://oauth2:${WEBLATE_ACCESS_TOKEN}@${CI_SERVER_FQDN}/${CI_PROJECT_PATH}.git
    - git add .
    - git status --porcelain | grep "^[MA]" || exit 0 # check if files were added/changed
    - 'git commit -m "Maintenance: Update translated files and catalog"'
    - git show --stat
    - git push gitlab_origin HEAD:$CI_COMMIT_REF_NAME
  after_script: []


# Posts a digest of merged dependency updates (incl. release note highlights and
# transitive lockfile changes) via webhook.
#
# Schedule variable (set on the pipeline schedule / manual web run):
#   JOB_FILTER="dependency digest"  - required; selects this job and suppresses all others
#
# Required CI/CD variables:
#   WEBHOOK_URL                     - incoming webhook of the target chat channel (masked)
#
# Required for the AI summary (without both, a mechanical digest is posted):
#   LLM_API_URL                     - Ollama base URL
#   LLM_MODEL                       - model family and size; the newest installed model
#                                     of that family is picked automatically
#
# Optional CI/CD variables:
#   LLM_MODEL_FALLBACKS             - comma-separated models to try if nothing of the family is installed
#   LLM_MODEL_PATTERN               - regex overriding the derived family pattern
#   LLM_API_KEY                     - bearer token, if the LLM endpoint is put behind auth
#   LLM_NUM_CTX / LLM_TIMEOUT       - context window (default 65536) / request timeout in s (default 900)
#   GITHUB_TOKEN                    - raises the GitHub API rate limit for release note fetching
#   GITLAB_API_TOKEN                - read_api token for the MR query (defaults to RENOVATE_TOKEN)
'dependency digest':
  stage: automate
  cache: []
  rules:
    - !reference [.job_rules, main_repository_only]
    - if: $BROWSER_TEST_FILTER
      when: never
    - if: $JOB_FILTER == $CI_JOB_NAME && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_REF_NAME == "develop"
    - when: never
  variables:
    GIT_DEPTH: '500'
  # Exit code 2 means the digest was posted, but without the configured LLM (endpoint down, model missing) - show the job as "passed with warnings".
  allow_failure:
    exit_codes: [2]
  # The script is stdlib-only, so no bundle_install - but Ruby comes from RVM
  #   in the default CI image and has to be put on PATH.
  before_script:
    - !reference [.scripts, source_rvm]
  script:
    - ruby .gitlab/dependency_digest.rb --since 7
  after_script: []

# Checks updatecli configuration and creates merge request if there are changes.
'updatecli':
  stage: automate
  image:
    name: ghcr.io/updatecli/updatecli:latest
    entrypoint: ['']
  cache: []
  rules:
    - !reference [.job_rules, main_repository_only]
    - if: $BROWSER_TEST_FILTER
      when: never
    - if: $JOB_FILTER && $JOB_FILTER != $CI_JOB_NAME
      when: never
    - if: ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_REF_NAME == "develop"
    - when: never
  before_script: []
  script:
    - updatecli pipeline apply --config .dev/updatecli.yaml --values .dev/updatecli-values-enable-gitlab.yaml
  after_script: []
