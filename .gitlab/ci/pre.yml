# Write CI cache once for faster runs
# Without the variable filters on purpose: filtered pipelines ($JOB_FILTER,
#   $BROWSER_TEST_FILTER) need the cache, too.
'write cache: ruby':
  stage: pre
  rules:
    - !reference [.rule_fragments, then_unless_vitest_browser_test_filter_only]
  cache: !reference [.cache, read_write_ruby]
  before_script:
    - !reference [.scripts, source_rvm]
  script:
    - !reference [.scripts, bundle_install]
  after_script: []

# No `rules:` on purpose: all filtered pipelines need the cache, too.
'write cache: nodejs':
  stage: pre
  cache: !reference [.cache, read_write_nodejs]
  script:
    - !reference [.scripts, pnpm_install_all]
  after_script: []

'push to github':
  stage: pre
  rules:
    - !reference [.rule_fragments, main_repository_only]
    # Don't apply job filter here.
    - if: $CI_COMMIT_REF_NAME =~ $CI_ZAMMAD_MR_ONLY_BRANCH_PATTERN
      when: never
    - when: always
  before_script:
    - test -d $HOME/.ssh || mkdir $HOME/.ssh
    - ssh-keyscan github.com >> $HOME/.ssh/known_hosts
    # ssh-agent is setgid, so ld.so would refuse the image's jemalloc LD_PRELOAD with an error.
    - eval $(LD_PRELOAD= ssh-agent -s)
    - echo "$PUSH_TO_GITHUB_SSH_PRIVATE_KEY" | ssh-add -
    - ssh-add -l
  script:
    - script/build/sync_repo.sh git@github.com:zammad/zammad.git
  after_script: []

'publish source archives':
  stage: pre
  tags:
    - push-to-ftp
  rules:
    - !reference [.rule_fragments, main_repository_only]
    # Don't apply job filter here.
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_COMMIT_BRANCH == "stable"
      when: always
    - when: never
  before_script:
    - test -d $HOME/.ssh || mkdir $HOME/.ssh
    - ssh-keyscan ftp.zammad.com >> $HOME/.ssh/known_hosts
    # ssh-agent is setgid, so ld.so would refuse the image's jemalloc LD_PRELOAD with an error.
    - eval $(LD_PRELOAD= ssh-agent -s)
    - echo "$FTP_ZAMMAD_COM_SSH_PRIVATE_KEY" | ssh-add -
    - ssh-add -l
  script:
    - script/build/deploy_archives.sh
  after_script: []
