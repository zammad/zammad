capybara:integration:other:
  extends:
    - .template_browser-core_capybara_chrome
    - .variables_idoit
    - .variables_proxy
  timeout: 20 minutes
  # These tests need third party service containers and are slow, so they are
  #   advisory in merge requests.
  rules:
    - !reference [.rule_fragments, variable_filters]
    - !reference [.rule_fragments, then_manual_in_mr]
  services:
    - !reference [.services, postgresql]
    - !reference [.services, selenium-chrome]
    - !reference [.services, redis]
    - !reference [.services, idoit]
    - !reference [.services, imap]
    - !reference [.services, proxy]
  script:
    - !reference [.scripts, zammad_ci_test_prepare]
    - bundle exec rspec -t integration -t ~integration_standalone spec/system

capybara:integration:saml:
  extends:
    - .template_browser-core_capybara_chrome
    - .variables_auth
  timeout: 20 minutes
  # These tests need third party service containers and are slow, so they are
  #   advisory in merge requests.
  rules:
    - !reference [.rule_fragments, variable_filters]
    - !reference [.rule_fragments, then_manual_in_mr]
  services:
    - !reference [.services, postgresql]
    - !reference [.services, selenium-chrome]
    - !reference [.services, redis]
    - !reference [.services, auth]
  script:
    - !reference [.scripts, zammad_ci_test_prepare]
    # Separate runs, since a repeated tag filter replaces the previous one. Both run even if the first one fails.
    - bundle exec rspec -t integration_standalone:saml spec/system || SAML_FAILED=1
    - bundle exec rspec -t integration_standalone:oidc spec/system
    - test -z "$SAML_FAILED"

.template_capybara_integration_otrs:
  extends:
    - .template_browser-core_capybara_chrome
  timeout: 20 minutes
  # These tests need third party service containers and are slow, so they are
  #   advisory in merge requests.
  rules:
    - !reference [.rule_fragments, variable_filters]
    - !reference [.rule_fragments, then_manual_in_mr]
  variables:
    IMPORT_OTRS_ENDPOINT: "http://zammad-ci-otrsimport-app/otrs/public.pl?Action=ZammadMigrator"
  services:
    - !reference [.services, postgresql]
    - !reference [.services, selenium-chrome]
    - !reference [.services, redis]
    - name: $CI_REGISTRY/docker/zammad-ci-otrsimport-db:otrs6
      alias: zammad-ci-otrsimport-db
    - name: $CI_REGISTRY/docker/zammad-ci-otrsimport-app:otrs6
      alias: zammad-ci-otrsimport-app

capybara:integration:otrs:
  extends:
    - .template_capybara_integration_otrs
  script:
    - !reference [.scripts, zammad_ci_test_prepare]
    - bundle exec rspec -t integration_standalone:otrs spec/system/apps

capybara:integration:otrs:legacy:
  extends:
    - .template_capybara_integration_otrs
  script:
    - !reference [.scripts, zammad_ci_test_prepare]
    - bundle exec rspec -t integration_standalone:otrs spec/system/import
