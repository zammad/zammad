.template_browser-core_capybara_es:
  extends:
    - .template_browser-core_capybara
  script:
    - !reference [.scripts, zammad_ci_test_prepare]
    - bundle exec rspec --require ./spec/rspec_extensions.rb --fail-fast -t ~integration -t searchindex spec/system

.template_browser-core_capybara_chrome_es:
  extends:
    - .template_browser-core_capybara_es
    - .variables_selenium_chrome
  services:
    - !reference [.services, postgresql]
    - !reference [.services, elasticsearch]
    - !reference [.services, selenium-chrome]
    - !reference [.services, redis]

.template_browser-core_capybara_firefox_es:
  extends:
    - .template_browser-core_capybara_es
    - .variables_selenium_firefox
  services:
    - !reference [.services, postgresql]
    - !reference [.services, elasticsearch]
    - !reference [.services, selenium-firefox]
    - !reference [.services, redis]

.template_browser-core_capybara_playwright_es:
  extends:
    - .template_browser-core_capybara_es
    - .variables_playwright
  services:
    - !reference [.services, postgresql]
    - !reference [.services, elasticsearch]
    - !reference [.services, playwright]
    - !reference [.services, redis]
  # A job-level artifacts block replaces the global default one entirely -
  #   repeat its paths and add the traces recorded by playwright_traces.rb.
  artifacts:
    expire_in: 1 week
    when: on_failure
    paths:
      - tmp/screenshot*
      - tmp/screenshots/*
      - tmp/playwright-traces/*
      - log/*.log

capybara:es:chrome:
  extends:
    - .template_browser-core_capybara_chrome_es

capybara:es:firefox:
  extends:
    - .template_browser-core_capybara_firefox_es
    - .job_rules_manual_in_mr

# Shadow lane for the Playwright driver evaluation, twin of capybara:es:chrome:
#   the searchindex-tagged system specs are excluded from the main capybara
#   lanes, so the capybara:playwright shadow lane never covers them.
capybara:es:playwright:
  extends:
    - .template_browser-core_capybara_playwright_es
  allow_failure: true
