.template_capybara_filtered:
  # This template has to be listed *after* the browser template in `extends:`: its
  #   `rules:` and `script:` deliberately replace the inherited ones (lists are
  #   replaced, not merged).
  rules:
    - !reference [.rule_fragments, then_browser_test_filter_only]
  # Looping a single spec takes much longer than a regular slice of the suite.
  timeout: 2 hours
  variables:
    BROWSER_TEST_FILTER_LOOP_COUNT: 50
  script:
    - !reference [.scripts, zammad_ci_test_prepare]
    - |
      # An invalid count makes `seq` produce nothing, which would turn the job green
      #   without running a single test.
      [ "$BROWSER_TEST_FILTER_LOOP_COUNT" -gt 0 ] 2>/dev/null || { echo "> BROWSER_TEST_FILTER_LOOP_COUNT must be a positive number, got '$BROWSER_TEST_FILTER_LOOP_COUNT'."; exit 1; }
      report=$CI_PROJECT_DIR/$CI_JUNIT_REPORT_DIR/rspec.xml
      for i in $(seq $BROWSER_TEST_FILTER_LOOP_COUNT)
      do
        echo "> Run $i of $BROWSER_TEST_FILTER_LOOP_COUNT: $BROWSER_TEST_FILTER"
        bundle exec rspec --fail-fast $BROWSER_TEST_FILTER || exit 1
        # A filter that selects only pending examples lets RSpec exit successfully, which
        #   would turn the job green without running the spec under test.
        [ "$(grep -c '<testcase' $report)" -gt "$(grep -c '<skipped' $report)" ] || { echo "> Run $i did not run a single example, check the filter."; exit 1; }
      done

capybara:filtered:chromium:
  extends:
    - .template_browser-core_capybara_chromium
    - .template_capybara_filtered
    - .variables_auth
  services:
    - !reference [.template_browser-core_capybara_chromium, services]
    # Also add containers for integration tests here.
    - !reference [.services, auth]

capybara:filtered:firefox:
  extends:
    - .template_browser-core_capybara_firefox
    - .template_capybara_filtered
    - .variables_auth
  services:
    - !reference [.template_browser-core_capybara_firefox, services]
    # Also add containers for integration tests here.
    - !reference [.services, auth]
