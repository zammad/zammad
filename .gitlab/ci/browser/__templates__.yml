.template_browser-core_capybara:
  stage: browser
  extends:
    - .template_ruby
    - .tags_docker_low_concurrency
    - .artifacts_with_test_report
  rules:
    - !reference [.rule_fragments, variable_filters]
    - !reference [.rule_fragments, backend_changes_in_mr]
    - !reference [.rule_fragments, frontend_changes_in_mr]
    - !reference [.rule_fragments, legacy_frontend_changes_in_mr]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab/ci/browser.yml
        - .gitlab/ci/browser/**/*
      when: on_success
    - !reference [.rule_fragments, then_manual_in_mr]
  needs:
    - !reference [.needs, ruby]
    - !reference [.needs, database]
    - !reference [.needs, assets]
    - !reference [.needs, lint]
  timeout: 40 minutes
  script:
    - !reference [.scripts, zammad_ci_test_prepare]
    - bundle exec rspec --require ./spec/rspec_extensions.rb --fail-fast -t ~integration -t ~searchindex spec/system

.template_browser-core_capybara_chromium:
  extends:
    - .template_browser-core_capybara
    - .variables_playwright
  services:
    - !reference [.services, postgresql]
    - !reference [.services, playwright]
    - !reference [.services, redis]

.template_browser-core_capybara_firefox:
  extends:
    - .template_browser-core_capybara
    - .variables_playwright_firefox
  # Chromium covers the same specs, so the Firefox lane is advisory in merge requests.
  rules:
    - !reference [.rule_fragments, variable_filters]
    - !reference [.rule_fragments, then_manual_in_mr]
  services:
    - !reference [.services, postgresql]
    - !reference [.services, playwright]
    - !reference [.services, redis]
