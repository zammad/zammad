workflow:
  # A new commit cancels the interruptible jobs of the older pipelines on the same ref.
  #   The default `conservative` cancels nothing as soon as one job with
  #   `interruptible: false` has started.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Scheduled and manually started pipelines are started on purpose, also with a
    #   filter variable - a push to the same branch must not cancel them.
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
      auto_cancel:
        on_new_commit: none
      when: always
    # Allow duplicate pipelines for filtered pipelines as we cannot pass variables from the
    #   git push commandline to merge request pipelines.
    #   (see https://docs.gitlab.com/ee/user/project/push_options.html)
    - if: $JOB_FILTER || $BROWSER_TEST_FILTER
      when: always
    # Avoid duplicate branch and MR pipelines for push events to branches with an open MR.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    # Don't create branch pipelines for pushes to private branches (as there will also be a MR for them).
    - if: $CI_COMMIT_BRANCH =~ $CI_ZAMMAD_MR_ONLY_BRANCH_PATTERN && $CI_PIPELINE_SOURCE == "push"
      when: never
    - when: always
