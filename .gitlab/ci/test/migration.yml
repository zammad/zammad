#
# Test the migration from the `stable-6.0` branch to `develop`.
#
rspec:migration:
  stage: test
  extends:
    - .job_rules_default
    - .artifacts_with_test_report
  needs:
    - !reference [.needs, ruby]
    - !reference [.needs, lint]
  timeout: 20 minutes
  cache: !reference [.cache, read_only_ruby]
  services:
    - !reference [.services, postgresql]
    - !reference [.services, redis]
  # The database must be initialized by the code of the stable branch, so the database dump
  #   of this pipeline must not be used here.
  dependencies: []
  script:
    # First, checkout stable and set it up.
    - git fetch --depth=1 origin stable-6.0
    - git checkout FETCH_HEAD
    - !reference [.scripts, source_rvm]
    - rvm use $(cat .ruby-version)
    - bundle config set without mysql
    - !reference [.scripts, bundle_install]
    - !reference [.scripts, configure_environment]
    - !reference [.scripts, zammad_db_init]
    # Then, switch to the current commit, migrate to it and run a few selected tests.
    - git checkout $CI_COMMIT_SHA
    - rvm use $(cat .ruby-version)
    - !reference [.scripts, bundle_install]
    # Force redis usage, even if it was disabled by the initial configure_environment script of stable.
    - export REDIS_URL=redis://redis
    - bundle exec rails db:migrate
    - RAILS_CHECK_PENDING_MIGRATIONS=1 bundle exec rspec spec/db -t ~searchindex
