.template_integration_es:
  services:
    - !reference [.services, postgresql]
    - !reference [.services, redis]
    - !reference [.services, memcached]
    - !reference [.services, elasticsearch]
  stage: test
  script:
    - !reference [.scripts, zammad_db_init]
    - bundle exec rspec --tag searchindex --tag ~type:system

# Lowest and highest supported Elasticsearch versions. 'stable' is tested in
#   every pipeline, 'latest' automatically only in scheduled pipelines and
#   manually triggerable in all others.
rspec:es:
  extends:
    - .template_integration_es
  parallel:
    matrix:
      - ELASTICSEARCH_TAG: [stable, latest]
  rules:
    - !reference [.rule_fragments, variable_filters]
    # The lowest supported version is covered in every pipeline.
    - if: $ELASTICSEARCH_TAG == "stable"
      when: on_success
    - !reference [.rule_fragments, then_manual_unless_scheduled]
