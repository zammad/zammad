.template_integration_es:
  extends:
    - .job_rules_default
  services:
    - !reference [.services, postgresql]
    - !reference [.services, redis]
    - !reference [.services, memcached]
    - !reference [.services, elasticsearch]
  stage: test
  script:
    - !reference [.scripts, zammad_db_init]
    - bundle exec rspec --tag searchindex --tag ~type:system

# Lowest supported version. Uses the pinned '7' image rather than ':stable', which tracks
#   Elasticsearch 8 since Zammad 7.2 - see ELASTICSEARCH_TAG in __includes__/variables.yml.
rspec:es:stable:
  extends:
    - .template_integration_es
  variables:
    ELASTICSEARCH_TAG: '7'

# Highest supported version (except for newer releases that are not yet in CI)
rspec:es:latest:
  extends:
    - .template_integration_es
  variables:
    ELASTICSEARCH_TAG: 'latest'
