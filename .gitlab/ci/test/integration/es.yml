.template_integration_es:
  extends:
    - .template_ruby
    - .artifacts_with_test_report
  services:
    - !reference [.services, postgresql]
    - !reference [.services, redis]
    - !reference [.services, memcached]
    - !reference [.services, elasticsearch]
  stage: test
  needs:
    - !reference [.needs, ruby]
    - !reference [.needs, database]
    - !reference [.needs, lint]
  timeout: 30 minutes
  script:
    - !reference [.scripts, zammad_db_init]
    - bundle exec rspec --tag searchindex --tag ~browser_app

# Lowest and highest supported Elasticsearch versions. 'stable' is tested like
#   the other backend tests, 'latest' automatically only in scheduled pipelines
#   and manually triggerable in all others.
rspec:es:
  extends:
    - .template_integration_es
  parallel:
    matrix:
      - ELASTICSEARCH_TAG: [stable, latest]
  rules:
    - !reference [.rule_fragments, variable_filters]
    - if: $ELASTICSEARCH_TAG == "latest" && $CI_PIPELINE_SOURCE == "schedule"
      when: on_success
    - if: $ELASTICSEARCH_TAG == "latest"
      when: manual
      allow_failure: true
    - !reference [.rule_fragments, backend_changes_in_mr]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab/ci/test/integration.yml
        - .gitlab/ci/test/integration/es.yml
      when: on_success
    - !reference [.rule_fragments, then_manual_in_mr]
