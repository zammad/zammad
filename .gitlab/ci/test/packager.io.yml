.packager.io:
  image: docker
  stage: test
  interruptible: false
  allow_failure: true
  retry: 2
  rules:
    - !reference [.rule_fragments, main_repository_only]
    # Don't apply job filter here.
    # These jobs can only run for a) published paths and b) when triggered after the packager.io build is complete.
    #   The pattern is deliberately not anchored at the end: packager.io publishes a
    #   repository per branch, so stable-* maintenance branches are valid targets, too.
    - if: ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_REF_NAME =~ /^(stable|develop)/
      when: on_success
    - when: never
  services: []
  cache: []
  before_script: []
  script:
    - .gitlab/packager.io/run_scenarios.sh
  after_script:
    - .gitlab/packager.io/cleanup.sh

packager.io:
  extends: [.packager.io]
  parallel:
    matrix:
      - DISTRO: [debian-11, debian-12, debian-13, ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, rhel-9, rhel-10, sles-15, sles-16.0]
