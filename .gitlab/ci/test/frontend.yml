.template_vitest_shard:
  stage: test
  extends:
    - .no_artifact_dependencies
    - .artifacts_with_test_report
  rules:
    - !reference [.rule_fragments, variable_filters]
    - !reference [.rule_fragments, frontend_changes_in_mr]
    - !reference [.rule_fragments, then_manual_in_mr]
  needs:
    - !reference [.needs, nodejs]
    - !reference [.needs, lint]
  timeout: 15 minutes
  cache: !reference [.cache, read_only_nodejs]
  before_script:
    - !reference [.scripts, pnpm_install]
    - !reference [.scripts, pnpm_install_eslint_plugin_zammad]
  script:
    # Only run one worker to avoid load peaks affecting other jobs.
    # Vitest resolves a relative output file against app/frontend, its root.
    - pnpm test --max-workers=1 --shard $CI_NODE_INDEX/$CI_NODE_TOTAL --reporter=default --reporter=junit --outputFile.junit=$CI_PROJECT_DIR/$CI_JUNIT_REPORT_DIR/vitest.xml
    # Stop here, except on the first shard.
    - "[[ $CI_NODE_INDEX = 1 ]] || exit 0"
    - echo "Also test eslint-plugin-zammad…"
    - cd .eslint-plugin-zammad
    - pnpm test

frontend:vitest:
  extends:
    - .template_vitest_shard
  parallel: 5

.template_vitest_browser:
  stage: test
  extends:
    - .no_artifact_dependencies
    - .variables_playwright
  needs:
    - !reference [.needs, nodejs]
    - !reference [.needs, lint]
  cache: !reference [.cache, read_only_nodejs]
  services:
    - !reference [.services, playwright]
  before_script:
    - !reference [.scripts, pnpm_install]
  artifacts:
    expire_in: 1 week
    when: always
    paths:
      # Actual and diff images of failed screenshot comparisons.
      - app/frontend/.vitest/attachments/*
    reports:
      junit: tmp/junit/*.xml

frontend:vitest:browser:
  extends:
    - .template_vitest_browser
  rules:
    - !reference [.rule_fragments, variable_filters]
    - !reference [.rule_fragments, frontend_changes_in_mr]
    - !reference [.rule_fragments, then_manual_in_mr]
  timeout: 15 minutes
  script:
    - pnpm test:browser --run --reporter=default --reporter=junit --outputFile.junit=$CI_PROJECT_DIR/$CI_JUNIT_REPORT_DIR/vitest-browser.xml

# Loops the browser specs selected with VITEST_BROWSER_TEST_FILTER, optionally narrowed
#   to the examples matching VITEST_BROWSER_TEST_NAME_PATTERN. A separate Vitest run per
#   loop, so that flakes of a cold start show up, too.
frontend:vitest:browser:filtered:
  extends:
    - .template_vitest_browser
  rules:
    - !reference [.rule_fragments, then_vitest_browser_test_filter_only]
  timeout: 1 hour
  variables:
    VITEST_BROWSER_TEST_FILTER_LOOP_COUNT: 50
  script:
    - |
      # An invalid count makes `seq` produce nothing, which would turn the job green
      #   without running a single test.
      [ "$VITEST_BROWSER_TEST_FILTER_LOOP_COUNT" -gt 0 ] 2>/dev/null || { echo "> VITEST_BROWSER_TEST_FILTER_LOOP_COUNT must be a positive number, got '$VITEST_BROWSER_TEST_FILTER_LOOP_COUNT'."; exit 1; }
      report=$CI_PROJECT_DIR/$CI_JUNIT_REPORT_DIR/vitest-browser.xml
      for i in $(seq $VITEST_BROWSER_TEST_FILTER_LOOP_COUNT)
      do
        echo "> Run $i of $VITEST_BROWSER_TEST_FILTER_LOOP_COUNT: $VITEST_BROWSER_TEST_FILTER $VITEST_BROWSER_TEST_NAME_PATTERN"
        pnpm test:browser --run --bail=1 ${VITEST_BROWSER_TEST_NAME_PATTERN:+-t "$VITEST_BROWSER_TEST_NAME_PATTERN"} --reporter=default --reporter=junit --outputFile.junit=$report $VITEST_BROWSER_TEST_FILTER || exit 1
        # A filter that selects only skipped tests lets Vitest exit successfully, which
        #   would turn the job green without running the spec under test.
        [ "$(grep -c '<testcase' $report)" -gt "$(grep -c '<skipped' $report)" ] || { echo "> Run $i did not run a single test, check the filter."; exit 1; }
      done
