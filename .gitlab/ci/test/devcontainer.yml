'build: devcontainer':
  stage: test
  image: node:24-alpine
  tags:
    - docker
  # The job only needs the repository checkout. Without this, it implicitly
  # depends on the artifacts of all earlier stages, so retrying it after those
  # artifacts expired fails with `missing_dependency_failure`.
  needs: []
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DEVCONTAINERS_CLI_VERSION: '0.87.0'
  cache: []
  before_script:
    - apk add --no-cache docker-cli docker-cli-buildx docker-compose
  after_script: []
  parallel:
    matrix:
      - VARIANT: [default, with-ldap, with-mailserver, with-ollama, with-selenium]
  script:
    - npx --yes @devcontainers/cli@$DEVCONTAINERS_CLI_VERSION build
        --workspace-folder .
        --config .devcontainer/$VARIANT/devcontainer.json
        --frozen-lockfile
  rules:
    - !reference [.rule_fragments, variable_filters]
    - !reference [.rule_fragments, then_manual_unless_scheduled]
