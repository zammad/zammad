'build: devcontainer':
  stage: test
  image: node:24-alpine
  tags:
    - docker
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DEVCONTAINERS_CLI_VERSION: '0.87.0'
  cache: []
  before_script:
    - apk add --no-cache docker-cli docker-cli-buildx docker-compose
  after_script: []
  parallel:
    matrix:
      - VARIANT: [default, with-ldap, with-mailserver, with-ollama, with-selenium]
  script:
    - npx --yes @devcontainers/cli@$DEVCONTAINERS_CLI_VERSION build
        --workspace-folder .
        --config .devcontainer/$VARIANT/devcontainer.json
        --frozen-lockfile
  rules:
    - !reference [.job_rules, variable_filters]
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success
    - when: manual
      allow_failure: true
