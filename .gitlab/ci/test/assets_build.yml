assets:build:
  stage: test
  needs:
    - !reference [.needs, ruby]
    - !reference [.needs, nodejs]
    - !reference [.needs, lint]
  timeout: 15 minutes
  # Without the variable filters on purpose: the browser jobs of a filtered pipeline
  #   ($JOB_FILTER, $BROWSER_TEST_FILTER) still need the assets built here, as the
  #   specs themselves skip the compilation ($CI_SKIP_ASSETS_PRECOMPILE).
  rules:
    - !reference [.rule_fragments, then_unless_vitest_browser_test_filter_only]
  extends:
    - .template_ruby
    - .no_artifact_dependencies
  services:
    - !reference [.services, postgresql]
  artifacts:
    expire_in: 1 week
    paths:
      - public/assets/.sprockets-manifest*
      - public/assets/application-*
      - public/assets/knowledge_base*
      - public/assets/print-*
      - public/assets/frontend/vite
  cache: !reference [.cache, read_only_full]
  variables:
    RAILS_ENV: 'production'
    VITE_TEST_MODE: 1
    ZAMMAD_SAFE_MODE: 1
  script:
    - !reference [.scripts, pnpm_install]
    - !reference [.scripts, zammad_db_unseeded]
    - node -v
    # Don't require Redis.
    - bundle exec rake assets:precompile

# The job below builds a production-ready app, but without the test mode flag enabled (VITE_TEST_MODE).
#   This is needed in order to check PWA build, which is skipped in test mode due to stability concerns.
#   The job will not produce any artifacts, as it is only checking for build errors.
assets:build:pwa:
  stage: test
  extends:
    - .template_ruby
    - .no_artifact_dependencies
  rules:
    - !reference [.rule_fragments, variable_filters]
    - !reference [.rule_fragments, backend_changes_in_mr]
    - !reference [.rule_fragments, frontend_changes_in_mr]
    - !reference [.rule_fragments, legacy_frontend_changes_in_mr]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab/ci/test/assets_build.yml
      when: on_success
    - !reference [.rule_fragments, then_manual_in_mr]
  needs:
    - !reference [.needs, ruby]
    - !reference [.needs, nodejs]
    - !reference [.needs, lint]
  timeout: 15 minutes
  services:
    - !reference [.services, postgresql]
  cache: !reference [.cache, read_only_full]
  variables:
    RAILS_ENV: 'production'
    ZAMMAD_SAFE_MODE: 1
  script:
    - !reference [.scripts, pnpm_install]
    - !reference [.scripts, zammad_db_unseeded]
    - node -v
    # Don't require Redis.
    - bundle exec rake assets:precompile
