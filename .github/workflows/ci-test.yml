name: Test

on:
  pull_request:
    branches: [newbyte-stable]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v3
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm lint:ts

      - name: ESLint
        run: pnpm lint:js

      - name: Stylelint
        run: pnpm lint:css

  test-frontend:
    name: Frontend Tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v3
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm vitest run --shard=${{ matrix.shard }}
        env:
          VTL_SKIP_AUTO_CLEANUP: true
          TZ: utc

  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    container:
      image: ruby:3.4.8-slim
    steps:
      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential git curl libyaml-dev libssl-dev \
            libpq-dev libimlib2-dev

      - uses: actions/checkout@v6

      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: gems-${{ hashFiles('Gemfile.lock') }}
          restore-keys: gems-

      - name: Install gems
        run: |
          bundle config set --local deployment 'true'
          bundle config set --local path 'vendor/bundle'
          bundle install -j "$(nproc)"

      - name: Brakeman
        run: bundle exec brakeman -o /dev/stdout -o tmp/brakeman-report.html

  test-rspec:
    name: RSpec (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    container:
      image: ruby:3.4.8-slim
    services:
      postgresql:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zammad
          POSTGRES_PASSWORD: zammad
          POSTGRES_DB: zammad_test
        options: >-
          --health-cmd "pg_isready -U zammad"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      REDIS_URL: redis://redis:6379
      Z_LOCALES: "en-us:de-de"
      TZ: Europe/London
    steps:
      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential git curl libpq-dev libimlib2-dev \
            libyaml-dev gettext shared-mime-info gnupg

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: gems-${{ hashFiles('Gemfile.lock') }}
          restore-keys: gems-

      - name: Install dependencies
        run: |
          bundle config set --local deployment 'true'
          bundle config set --local path 'vendor/bundle'
          bundle install -j "$(nproc)"
          pnpm install --frozen-lockfile

      - name: Configure environment
        run: bundle exec ruby .gitlab/configure_environment.rb

      - name: Initialize database
        run: bundle exec rake zammad:db:init

      - name: Select spec files for shard
        run: |
          shard=${{ matrix.shard }}
          if [ "$shard" -eq 5 ]; then
            find spec/db/migrate -name '*_spec.rb' | sort > /tmp/shard_specs.txt
            echo "Running $(wc -l < /tmp/shard_specs.txt) migration specs (shard 5/5)"
          else
            find spec -name '*_spec.rb' -not -path 'spec/system/*' -not -path 'spec/db/migrate/*' | sort > /tmp/all_specs.txt
            total=$(wc -l < /tmp/all_specs.txt)
            num_shards=4
            per_shard=$(( (total + num_shards - 1) / num_shards ))
            start=$(( (shard - 1) * per_shard + 1 ))
            sed -n "${start},+$((per_shard - 1))p" /tmp/all_specs.txt > /tmp/shard_specs.txt
            echo "Running $(wc -l < /tmp/shard_specs.txt) of $total spec files (shard $shard/4)"
          fi

      - name: RSpec
        run: bundle exec rspec -t ~searchindex -t ~integration -t ~required_envs $(cat /tmp/shard_specs.txt | tr '\n' ' ')

  test-minitest:
    name: Minitest
    runs-on: ubuntu-24.04
    container:
      image: ruby:3.4.8-slim
    services:
      postgresql:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zammad
          POSTGRES_PASSWORD: zammad
          POSTGRES_DB: zammad_test
        options: >-
          --health-cmd "pg_isready -U zammad"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      REDIS_URL: redis://redis:6379
      Z_LOCALES: "en-us:de-de"
      TZ: Europe/London
    steps:
      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential git curl libpq-dev libimlib2-dev \
            libyaml-dev gettext shared-mime-info gnupg

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: gems-${{ hashFiles('Gemfile.lock') }}
          restore-keys: gems-

      - name: Install dependencies
        run: |
          bundle config set --local deployment 'true'
          bundle config set --local path 'vendor/bundle'
          bundle install -j "$(nproc)"
          pnpm install --frozen-lockfile

      - name: Configure environment
        run: bundle exec ruby .gitlab/configure_environment.rb

      - name: Initialize database
        run: bundle exec rake zammad:db:init

      - name: Minitest
        run: bundle exec rake test:units
