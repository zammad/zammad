name: custom-docker-release

# Builds and publishes our customized Zammad image (Persian/RTL fork) to
# GitHub Container Registry so it can be consumed by our zammad-docker-compose fork.

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-build-image:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata action
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/zammad
          tags: |
            type=raw,value=latest
            type=raw,value=develop
            type=sha,prefix=develop-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
