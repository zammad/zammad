name: docker-ci

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/docker-ci.yaml'

jobs:
  docker-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata action
        id: meta
        uses: docker/metadata-action@v5
        with:
          images:
            zammad-local
          tags: |
            type=raw,latest

      - name: Build Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          outputs: type=docker,dest=/tmp/zammad-local.tar

      - name: Checkout docker compose files
        uses: actions/checkout@v6
        with:
          repository: zammad/zammad-docker-compose
          path: zammad-docker-compose

      - name: Run docker compose tests
        run: |
          cd zammad-docker-compose
          docker load --input /tmp/zammad-local.tar

          # Tag the loaded image so docker-compose doesn't try to pull it
          docker tag zammad-local:latest zammad-local:latest

          cat - <<ENV_FILE >> .env
          IMAGE_REPO=zammad-local
          VERSION=latest
          ENV_FILE

          # Skip pulling images since we loaded them locally
          export DOCKER_COMPOSE_PULL_POLICY=never

          .github/tests/setup/default.sh
          .github/tests/default.sh

          docker compose ps
          # Ensure we are running with the correct image
          docker compose ps | grep zammad-local:latest
