# Syft reads this file from its working directory. Select the settings for what is
#   scanned with a profile, e.g. `syft scan dir:. --profile repository`.
# The SBOM attestation of the Docker image is generated by BuildKit, which ignores this file.

# Builds must not depend on Anchore's update server.
check-for-app-update: false

profiles:
  # The dependencies that ship with Zammad, as declared in the lockfiles of the
  #   checkout. The other lockfiles only hold build and development tooling.
  repository:
    default-catalogers:
      - ruby-gemfile-cataloger
      - javascript-lock-cataloger
    # Only packages: the file catalogers would add the lockfiles themselves. Both
    #   settings are needed, either alone makes syft warn about the other.
    select-catalogers:
      - -file
    file:
      metadata:
        selection: none
    exclude:
      - ./.eslint-plugin-zammad/**
      - ./public/assets/chat/**
      - ./public/assets/images/**

  # The installed contents of a packager.io package, scanned in its build directory
  #   (contrib/packager.io/after.sh). The sbom-cataloger merges the JS dependencies
  #   from pnpm-lock.cdx.json, they only exist compiled into the assets.
  packager-io:
    default-catalogers:
      - image
    select-catalogers:
      - +sbom-cataloger
      - -file
    file:
      metadata:
        selection: none
