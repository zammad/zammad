    body:
      encoding: UTF-8
      string: '{"input":["Building a daily digest of open tickets for team leads\n\nTeam
        leads often want a single email each morning summarizing everything still
        open, rather than being copied on every individual ticket event throughout
        the day. This is a job that runs on a fixed timetable across the whole ticket
        database, independent of what any one ticket is doing at that moment - typically
        once daily, though some teams prefer twice a day for busier queues.Define
        a search for the tickets you want counted (state ''open'', optionally scoped
        to specific Groups), attach it to a recurring job set to run at a chosen time
        such as 7am, and configure the email content to summarize the matching tickets
        - a simple count plus a table of ticket numbers and subjects works well for
        most teams. Because it runs on its own clock, the email always goes out at
        the same time regardless of how many tickets were opened or closed that day,
        and it reports on whatever the current state of the queue happens to be at
        that moment, not on any single event."],"llm":"bge-m3"}'
