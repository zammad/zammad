- request:
    method: post
    uri: https://ai.zammad.com/api/v1/features/embed
    body:
      encoding: UTF-8
      string: '{"input":"Customers aren''t getting a confirmation email when we close
        their ticket\n\nWe''d like customers to automatically receive a short ''your
        request has been resolved'' email the moment an agent sets a ticket to ''closed''.
        Right now nothing happens automatically at all when we close a ticket, agents
        have to write that message by hand every single time. Is there a way to automate
        this in the admin panel?\n\nTo be clear, we don''t need this on a schedule
        or at a fixed time of day - it should fire immediately, right when the specific
        ticket''s state changes to closed, for that one ticket only.\n\nJust to rule
        it out: we''re not looking for something an agent has to click or select manually
        either, like applying a canned response to a batch of tickets - this should
        happen entirely on its own once the state changes, without anyone doing anything
        extra at the moment of closing.\n\nGreat, that sounds like exactly what we
        need. One follow-up: does this only work for the ''closed'' state, or could
        we reuse the same mechanism later for other state changes too, like when a
        ticket moves to ''pending customer''?","llm":"bge-m3"}'
