- request:
    method: post
    uri: https://ai.zammad.com/api/v1/features/embed
    body:
      encoding: UTF-8
      string: '{"input":["Applying a set of changes to several tickets at once with
        one click\n\nWhen an agent needs to apply the same set of changes to a handful
        of tickets right now - for example setting a state, adding a note, and changing
        the owner all in one go - a saved shortcut lets them select the tickets and
        apply everything with a single click, instead of clicking through each field
        on every ticket individually. This only runs when an agent deliberately chooses
        to apply it to a specific selection; it never fires on its own in reaction
        to a ticket changing, and it isn''t tied to any schedule either.To create
        one: define the exact set of field changes you want applied (state, owner,
        tags, a note text, and so on), give it a clear name describing what it does,
        and make it available to the relevant Groups. Agents can then select one or
        more tickets from an overview and apply it whenever they choose to - the timing
        and the decision to run it are always manual, which is the key difference
        from anything that reacts automatically to a condition or runs on a timer."],"llm":"bge-m3"}'
