    body:
      encoding: UTF-8
      string: '{"input":["Planning a Role structure before onboarding a larger team\n\nBefore
        adding a batch of new hires, it''s worth deciding upfront which Role each
        person needs, since Roles decide the shape of what someone can reach across
        the whole system - not just tickets, but the admin area, reporting, the knowledge
        base editor, and so on. Most support teams only ever need two: ''Agent'' for
        anyone handling tickets day to day, and ''Admin'' for the handful of people
        who configure the system itself. Customer-facing staff should almost never
        get the Admin role just to make a small config change; instead, grant the
        one specific admin permission they need (e.g. managing text modules) without
        handing them the whole admin area.A common mistake is assuming a broader Role
        will also open up more of the ticket queues someone works in day to day -
        it won''t. Role changes affect what buttons and admin sections a person sees,
        but nothing about which tickets show up for them; that''s a separate, per-department
        decision made elsewhere. Keep the number of distinct Roles small (two or three
        is plenty for most setups) since every extra Role is one more thing to keep
        in sync as your permission needs evolve."],"llm":"nomic-embed-text"}'
