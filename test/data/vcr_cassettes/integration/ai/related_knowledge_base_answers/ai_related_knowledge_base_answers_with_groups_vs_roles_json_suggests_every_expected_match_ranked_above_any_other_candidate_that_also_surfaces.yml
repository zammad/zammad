    body:
      encoding: UTF-8
      string: '{"input":"New agent can''t see any tickets in the Support queue\n\nHi,
        we just added a new agent to the system and gave them the ''Agent'' role,
        but they still can''t see any of the tickets in the Support queue - the overview
        just shows up empty for them. Other agents on the same team can see those
        tickets fine, so it doesn''t seem like a general bug. What are we missing
        in the setup?\n\nJust to confirm: in the admin panel under Manage \u003e Roles,
        the new user does have the ''Agent'' role assigned, same as everyone else
        on the team. I double-checked that. I''m not sure what else controls which
        tickets someone can actually see.\n\nWe also checked the customer side just
        in case, but this new hire is an internal agent, not a customer, so I don''t
        think that''s related - the tickets they should see belong to our own Support
        queue, not to any particular customer''s account.\n\nFor what it''s worth,
        this person is replacing someone who left the team a few weeks ago. I''m not
        sure if we ever removed the old employee from anything, could that be conflicting
        somehow?","llm":"bge-m3"}'
