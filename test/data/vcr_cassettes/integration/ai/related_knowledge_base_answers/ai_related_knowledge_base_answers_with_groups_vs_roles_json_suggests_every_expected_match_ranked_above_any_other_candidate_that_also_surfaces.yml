    body:
      encoding: UTF-8
      string: '{"input":["Why a new agent sees an empty overview even with the Agent
        role assigned\n\nThis is almost always a missing Group membership, not a Role
        problem. Every ticket in Zammad belongs to exactly one Group (think of a Group
        as a queue, mailbox, or department - ''Support'', ''Sales'', ''Billing'',
        and so on), and an overview only ever shows tickets from Groups the logged-in
        agent is actually a member of. Having the ''Agent'' role just marks someone
        as agent-type staff in general; it says nothing about which of the many Groups
        in the system they''re allowed into.Open the Support Group''s settings page
        and check its member list - a freshly created user is very often not added
        to any Group at all by default, which is exactly why their overviews come
        back empty no matter how many tickets exist. Add the person there, tick at
        least ''read'' access (add ''create'' and ''change'' too if they should be
        able to reply and update tickets), and save. There''s no need to touch Roles
        at all for this - the fix lives entirely on the Group side, and it takes effect
        the next time the agent''s overview refreshes."],"llm":"bge-m3"}'
