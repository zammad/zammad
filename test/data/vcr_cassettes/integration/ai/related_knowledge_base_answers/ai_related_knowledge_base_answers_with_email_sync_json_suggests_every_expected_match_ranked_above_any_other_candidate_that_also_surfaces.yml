    body:
      encoding: UTF-8
      string: '{"input":["Clearing your browser cache to fix a login page that won''t
        load correctly\n\nIf a login page in your browser looks broken, shows outdated
        content, or repeatedly fails to submit even with the correct username and
        password, a corrupted browser cache is a common cause. Clearing the cache
        forces the browser to download a fresh copy of the login page instead of reusing
        a stale, possibly broken, cached version.To clear your cache: 1) Open your
        browser''s settings menu and find the privacy or history section. 2) Choose
        to clear browsing data, selecting ''Cached images and files'' (you do not
        need to clear saved passwords or cookies for this). 3) Restart the browser
        completely, not just the tab. 4) Try loading the login page again in a fresh
        tab.If clearing the cache does not help, try logging in from a private/incognito
        window, which starts with no cache or extensions at all - if that works, a
        browser extension may be interfering with the normal page instead of the cache
        being the issue."],"llm":"bge-m3"}'
