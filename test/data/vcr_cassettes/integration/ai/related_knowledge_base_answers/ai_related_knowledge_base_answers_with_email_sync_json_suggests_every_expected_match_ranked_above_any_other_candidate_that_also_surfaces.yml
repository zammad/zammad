    body:
      encoding: UTF-8
      string: '{"input":["Setting up a forwarding rule to copy incoming mail to another
        address\n\nA forwarding rule automatically sends a copy of every incoming
        message from your mailbox to a second address you choose, which is useful
        for sharing a mailbox with a colleague or archiving mail externally. This
        is a deliberate, ongoing copy of everything from that point forward - it does
        not affect whether mail arrives in the original mailbox at all, and it has
        nothing to do with troubleshooting missing or delayed messages.To set one
        up: 1) Open the mail rules section of your webmail settings. 2) Create a new
        rule with no conditions (so it applies to every message) or a specific condition
        if you only want certain mail forwarded. 3) Choose the ''Forward to'' action
        and enter the destination address. 4) Save the rule - it takes effect for
        new mail arriving from that point on; it will not retroactively forward anything
        already delivered."],"llm":"bge-m3"}'
