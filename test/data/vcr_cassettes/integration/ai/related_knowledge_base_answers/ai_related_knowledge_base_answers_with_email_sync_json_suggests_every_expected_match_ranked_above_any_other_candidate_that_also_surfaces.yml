    body:
      encoding: UTF-8
      string: '{"input":["Fixing an IMAP mailbox that stops receiving new mail in
        a desktop client\n\nWhen a mailbox suddenly stops receiving new messages in
        a desktop email client (Outlook, Thunderbird, Apple Mail, etc.) while mail
        still arrives correctly on other devices or in webmail, the most common cause
        is that the client''s stored password no longer matches the current account
        password - for example after a routine password reset or a forced security
        update. Sending mail can keep working for a while even after this happens,
        because outgoing (SMTP) authentication is sometimes cached separately from
        incoming (IMAP) authentication, which is why only incoming mail appears broken
        at first.To fix this: 1) Open your email account''s connection settings in
        the desktop client. 2) Re-enter the current password for the mailbox exactly
        as used for webmail login. 3) Save the settings and perform a manual send/receive.","Fixing
        an IMAP mailbox that stops receiving new mail in a desktop client\n\n2) Re-enter
        the current password for the mailbox exactly as used for webmail login. 3)
        Save the settings and perform a manual send/receive. 4) If the client still
        does not prompt for a password or continues to fail silently, remove the account
        from the client entirely and re-add it from scratch using the current credentials,
        since some clients cache failed authentication state until the account is
        re-added.If re-entering the password does not resolve it, also double check
        that IMAP access itself is still enabled for the mailbox, since some providers
        disable IMAP automatically after several repeated authentication failures
        as a security measure."],"llm":"nomic-embed-text"}'
