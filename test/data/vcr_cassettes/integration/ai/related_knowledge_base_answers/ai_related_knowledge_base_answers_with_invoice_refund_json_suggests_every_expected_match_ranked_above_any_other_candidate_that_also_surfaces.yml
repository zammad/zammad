    body:
      encoding: UTF-8
      string: '{"input":["Understanding the layout of your monthly invoice PDF\n\nYour
        monthly invoice PDF is generated automatically on the first day of each billing
        cycle and sent to the billing email address on file. The invoice is split
        into several sections: the header shows your account number and billing period;
        the itemized table lists every individual order placed during that period
        along with its order number, date, and amount; a subtotal line sums up all
        itemized orders; and a final section lists any applicable taxes and the grand
        total charged to your payment method.If you need a copy of an older invoice,
        you can download it at any time from the billing section of your account under
        ''Invoice history'', where every past invoice is archived as a PDF. If any
        line item on the invoice looks unfamiliar, check the order number against
        your order history first, since bundled or split shipments sometimes appear
        as separate line items on the same invoice even though they belong to one
        order."],"llm":"nomic-embed-text"}'
