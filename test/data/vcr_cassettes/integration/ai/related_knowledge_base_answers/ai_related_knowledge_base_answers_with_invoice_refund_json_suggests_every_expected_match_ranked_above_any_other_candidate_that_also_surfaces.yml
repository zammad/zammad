    body:
      encoding: UTF-8
      string: '{"input":["Requesting a refund for a duplicate or accidental charge\n\nIf
        you were charged more than once for the same order, this is usually caused
        by a temporary network issue or a page reload during checkout, which can submit
        the payment request twice even though you only clicked ''Pay'' once. Duplicate
        charges are not intentional and are always eligible for a full refund of the
        extra amount.To request a refund for a duplicate charge: 1) Locate the order
        number and the exact amount and date of both charges on your bank or card
        statement. 2) Contact support with this information, ideally including a screenshot
        of the statement. 3) Our billing team will verify that both charges reference
        the same order and, once confirmed, issue a refund for the duplicate amount
        back to the original payment method. 4) Refunds are typically visible on your
        statement within 5-10 business days, depending on your bank''s processing
        time.If the two charges are for genuinely different orders (different order
        numbers or different amounts), this is not a duplicate charge and the refund
        process described here does not apply - please contact support separately
        for that case."],"llm":"nomic-embed-text"}'
