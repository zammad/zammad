    body:
      encoding: UTF-8
      string: '{"input":"Charged twice for the same order\n\nHi, I just checked my
        credit card statement and it looks like I was billed twice for the same order
        (order #48213) on the same day. The amount is identical both times, 89.00
        EUR. I only placed the order once and only received one confirmation email,
        so I''m pretty sure this is a duplicate charge rather than two separate purchases.
        Could you please check on your end and refund the extra charge? I can send
        a screenshot of my bank statement if that helps speed things up.\n\nThanks
        for looking into it. Just to add some context: I placed the order through
        the mobile app, and the checkout screen did briefly freeze after I tapped
        ''Pay now'', so I wonder if that caused the payment to be submitted twice.
        I did not receive any error message telling me the payment failed, which is
        why I only tried once from my side.\n\nFollowing up - it''s been a few days
        now and the second charge still hasn''t been reversed. Is there anything else
        you need from me to process the refund for the duplicate charge?\n\nThanks
        for checking. I''ve attached the screenshot of my card statement showing both
        charges on the same day, same amount, same merchant reference - hopefully
        that makes it quicker to confirm on your end.\n\nOne more thing: this is a
        one-time purchase, not a subscription, so I don''t think this has anything
        to do with recurring billing - just wanted to rule that out in case it changes
        how the refund gets processed.","llm":"nomic-embed-text"}'
