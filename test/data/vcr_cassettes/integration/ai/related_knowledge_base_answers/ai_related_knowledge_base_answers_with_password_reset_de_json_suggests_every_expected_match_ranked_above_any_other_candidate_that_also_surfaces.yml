      string: '{"input":["Passwort zurücksetzen\n\nWenn Sie Ihr Passwort für das Kundenportal
        vergessen haben, klicken Sie auf der Login-Seite auf ''Passwort vergessen''.
        Geben Sie anschließend Ihre E-Mail-Adresse ein - Sie erhalten dann eine E-Mail
        mit einem Link, über den Sie ein neues Passwort vergeben können. Der Link
        ist aus Sicherheitsgründen nur für eine begrenzte Zeit gültig.Falls Sie keine
        E-Mail erhalten, prüfen Sie bitte zuerst Ihren Spam-Ordner. Kommt dort ebenfalls
        keine E-Mail an, stellen Sie sicher, dass Sie die E-Mail-Adresse verwenden,
        mit der Ihr Konto ursprünglich angelegt wurde."],"llm":"nomic-embed-text"}'
