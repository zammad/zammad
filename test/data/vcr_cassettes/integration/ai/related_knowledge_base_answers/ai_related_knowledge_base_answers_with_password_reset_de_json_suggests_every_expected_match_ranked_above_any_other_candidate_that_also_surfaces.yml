      string: '{"input":["Rechnungsadresse aktualisieren\n\nIhre Rechnungsadresse
        können Sie jederzeit in den Kontoeinstellungen unter ''Rechnungsdaten'' ändern.
        Tragen Sie dort die neue Adresse ein und speichern Sie die Änderung - sie
        gilt ab diesem Zeitpunkt für alle neuen Rechnungen, bereits ausgestellte Rechnungen
        werden dadurch nicht nachträglich geändert. Wird Ihr Konto von einer Organisation
        zentral verwaltet, kann in der Regel nur der zuständige Administrator die
        gemeinsame Rechnungsadresse anpassen."],"llm":"nomic-embed-text"}'
