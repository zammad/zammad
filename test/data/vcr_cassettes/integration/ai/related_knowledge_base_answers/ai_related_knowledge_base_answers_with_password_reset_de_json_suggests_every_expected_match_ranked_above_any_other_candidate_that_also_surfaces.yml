    body:
      encoding: UTF-8
      string: '{"input":"Kann mich nicht mehr im Kundenportal einloggen\n\nHallo,
        ich habe mein Passwort für das Kundenportal vergessen und komme nicht mehr
        in meinen Account. Können Sie mir sagen, wie ich ein neues Passwort bekomme?\n\nIch
        habe auf der Login-Seite nichts gefunden, worüber ich das selbst zurücksetzen
        könnte. Über eine schnelle Antwort würde ich mich freuen, da ich einen offenen
        Vorgang bei Ihnen habe.\n\nZur Sicherheit: Ich melde mich von derselben E-Mail-Adresse
        aus, mit der der Account ursprünglich angelegt wurde, falls das für die Zusendung
        des Links wichtig ist.\n\nVielen Dank für die schnelle Rückmeldung, ich schaue
        gleich in meinem Postfach nach.","llm":"nomic-embed-text"}'
