      string: '{"input":["Drucker auf Werkseinstellungen zurücksetzen\n\nWenn Ihr
        Drucker nicht mehr auf Druckaufträge reagiert, kann ein Zurücksetzen auf die
        Werkseinstellungen helfen. Trennen Sie dazu den Drucker vom Netzwerk und halten
        Sie die Ein/Aus-Taste etwa zehn Sekunden lang gedrückt, bis die Anzeige blinkt.
        Anschließend müssen Sie den Drucker erneut mit Ihrem WLAN verbinden und die
        Treiber gegebenenfalls neu installieren."],"llm":"bge-m3"}'
