      encoding: UTF-8
      string: '{"input":"Password reset link not working\n\nHi, I can''t get back
        into my account. I requested a password reset a couple of days ago but never
        got around to using the link.\n\nIch habe es gerade nochmal versucht, aber
        der Link in der E-Mail funktioniert nicht mehr - wenn ich draufklicke, steht
        dort nur ''Dieser Link ist abgelaufen''. Muss ich einen komplett neuen Antrag
        stellen oder gibt es eine andere Möglichkeit?\n\nJust to add in English again:
        the email itself is still the most recent one I received, I didn''t request
        a second one in the meantime, so I assume that''s why it''s expired by now.","llm":"nomic-embed-text"}'
