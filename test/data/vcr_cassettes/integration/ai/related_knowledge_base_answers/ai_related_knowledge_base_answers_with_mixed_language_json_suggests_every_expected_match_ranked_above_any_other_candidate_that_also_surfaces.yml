    body:
      encoding: UTF-8
      string: '{"input":["Why your two-factor authentication code stops working after
        a minute\n\nTwo-factor authentication codes are intentionally short-lived,
        usually valid for only about 30 to 60 seconds, to limit the window in which
        a leaked code could be misused. If you type in a code and it''s rejected as
        invalid or expired, the most common cause is simply that too much time passed
        between generating the code and submitting it - open your authenticator app
        again for a fresh one rather than reusing an old screenshot or a code you
        copied earlier.Also double-check that the clock on your phone or authenticator
        device is set to automatic network time; a device clock that has drifted out
        of sync is a common, less obvious reason codes are rejected even when entered
        quickly."],"llm":"bge-m3"}'
