      string: '{"input":["Refunds for annual plans\n\nRefund requests for annual plans
        are handled by the billing team, not in first level.1. Check in the customer''s
        account when the plan was renewed. Within 30 days of a renewal, a full refund
        is possible.2. After 30 days, offer a pro-rata credit for the remaining months
        instead of a refund.3. Add the internal note \"Refund requested\" with the
        renewal date, and move the ticket to the group Billing.4. Tell the customer
        that the billing team confirms the refund or the credit within two working
        days.Monthly plans are never refunded; they can be cancelled at the end of
        the month."],"llm":"bge-m3"}'
