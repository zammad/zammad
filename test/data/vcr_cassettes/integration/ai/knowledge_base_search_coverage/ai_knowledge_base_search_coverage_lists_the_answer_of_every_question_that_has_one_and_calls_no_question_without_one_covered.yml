    body:
      encoding: UTF-8
      string: '{"input":["Auto-replying to the customer the moment a ticket is closed\n\nSet
        this up as a condition-based rule that watches for the state change itself,
        rather than anything running on a timer. Create a new rule with the condition
        ''ticket state changed to closed'', and give it a notification action that
        emails the customer with your resolution message. Because the rule reacts
        to the change happening on that individual ticket, the customer gets the email
        within moments of the agent clicking ''closed'' - there''s no delay, no batching
        with other tickets, and nothing to wait for at a particular time of day.One
        thing to watch for: if your closing message could itself cause another status
        change (rare, but possible with some automation chains), add a guard so the
        same ticket doesn''t re-trigger the rule and send duplicate emails. Otherwise
        this is a five-minute setup - condition on the state, action to notify, done.
        The same mechanism works for any other state change too, not just ''closed''
        - just swap the condition to whichever state you want to react to."],"llm":"bge-m3"}'
