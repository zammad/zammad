- request:
    method: post
    uri: https://ai.zammad.com/api/v1/features/embed
    body:
      encoding: UTF-8
      string: '{"input":["How Organizations control which tickets customers can see
        from each other\n\nAn Organization groups multiple customer accounts together
        (for example everyone with an email address at the same company), and it controls
        visibility on the customer side of the portal, not on the agent side. Depending
        on how an Organization is configured, its members can either only ever see
        their own individual tickets, or also see every ticket raised by colleagues
        in the same Organization - handy for a company where several employees jointly
        manage one support relationship with you.This is entirely separate from how
        agents see tickets internally: an agent''s access is decided by Group membership
        regardless of which Organization the ticket''s customer belongs to, and a
        customer''s Organization membership has no effect on any agent''s queue. If
        a customer says they can (or can''t) see a colleague''s ticket, check the
        Organization''s sharing setting; if an agent can''t see a queue''s tickets,
        that''s a Group question instead."],"llm":"bge-m3"}'
