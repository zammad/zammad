        aus.\n{s5}\nTragen Sie anschließend die Adresse des gemeinsamen Postfachs
        ein.\n{s6}\nOhne eine Freigabe durch die IT-Abteilung ist kein Zugriff auf
        das Postfach möglich.\n{s7}\nPostfach\n{s8}\nBerechtigung\n{s9}\nSupport\n{s10}\nLesen
