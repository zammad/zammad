        13:16:36 UTC\u003c/created_at\u003e\n  \u003cvisibility\u003epublic\u003c/visibility\u003e\n  \u003ctext\u003e\u003c![CDATA[Hallo
        zusammen, seit letzter Woche beschweren sich mehrere unserer Kunden, dass
        die Antworten aus dem Helpdesk bei ihnen im Spam-Ordner landen. Betroffen
        sind vor allem Empfänger mit Gmail- und Outlook-Adressen. Vorher hat alles
        problemlos funktioniert. Wir haben in der Zwischenzeit nur unseren Mailserver
        gewechselt. Können Sie sich das bitte ansehen?]]\u003e\u003c/text\u003e\n\u003c/article\u003e\n\u003carticle\u003e\n  \u003csender_type\u003eAgent\u003c/sender_type\u003e\n  \u003ccreated_at\u003e2026-10-23
        13:16:36 UTC\u003c/created_at\u003e\n  \u003cvisibility\u003epublic\u003c/visibility\u003e\n  \u003ctext\u003e\u003c![CDATA[Guten
        Tag, vielen Dank für Ihre Meldung. Wir haben die Kopfzeilen einer betroffenen
        E-Mail geprüft. Die Prüfung des SPF-Eintrags schlägt fehl, weil der neue Mailserver
        nicht im SPF-Eintrag Ihrer Domain hinterlegt ist. Die empfangenden Server
        stufen die Nachrichten deshalb als verdächtig ein. Bitte ergänzen Sie im DNS-Eintrag
        vom Typ TXT Ihrer Domain den neuen Mailserver mit einem include-Eintrag, so
        wie es Ihr E-Mail-Anbieter in seiner Dokumentation beschreibt. Danach dauert
        es in der Regel einige Stunden, bis die Änderung überall übernommen wurde.]]\u003e\u003c/text\u003e\n\u003c/article\u003e\n\u003carticle\u003e\n  \u003csender_type\u003eCustomer\u003c/sender_type\u003e\n  \u003ccreated_at\u003e2026-10-23
        13:16:36 UTC\u003c/created_at\u003e\n  \u003cvisibility\u003epublic\u003c/visibility\u003e\n  \u003ctext\u003e\u003c![CDATA[Danke
        für die schnelle Hilfe! Wir haben den SPF-Eintrag wie beschrieben angepasst.
        Seit heute Morgen kommen alle Antworten wieder ganz normal im Posteingang
        an, auch bei Gmail und Outlook. Das Ticket kann geschlossen werden.]]\u003e\u003c/text\u003e\n\u003c/article\u003e\n"}'
