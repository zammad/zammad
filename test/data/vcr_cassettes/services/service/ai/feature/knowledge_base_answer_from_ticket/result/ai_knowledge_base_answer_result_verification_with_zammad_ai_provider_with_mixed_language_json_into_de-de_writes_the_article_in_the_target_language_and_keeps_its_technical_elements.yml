        13:16:54 UTC\u003c/created_at\u003e\n  \u003cvisibility\u003epublic\u003c/visibility\u003e\n  \u003ctext\u003e\u003c![CDATA[Hello,
        sorry for answering in English, our German-speaking colleague is out of office
        today. The export itself is correct: the CSV file is encoded in UTF-8. Excel,
        however, assumes a different encoding when a CSV file is opened with a double
        click, which breaks the umlauts. To open the file correctly, start Excel,
        go to Data, From Text/CSV, select the exported file and choose 65001: Unicode
        (UTF-8) as the file origin before loading it.]]\u003e\u003c/text\u003e\n\u003c/article\u003e\n\u003carticle\u003e\n  \u003csender_type\u003eCustomer\u003c/sender_type\u003e\n  \u003ccreated_at\u003e2026-10-23
        13:16:54 UTC\u003c/created_at\u003e\n  \u003cvisibility\u003epublic\u003c/visibility\u003e\n  \u003ctext\u003e\u003c![CDATA[Kein
        Problem, vielen Dank! Wir haben die Datei jetzt über Daten, Aus Text/CSV mit
        der Kodierung UTF-8 geöffnet und alle Umlaute werden richtig angezeigt. Wir
        haben die Anleitung auch an unsere Buchhaltung weitergegeben. Das Ticket kann
        geschlossen werden.]]\u003e\u003c/text\u003e\n\u003c/article\u003e\n"}'
