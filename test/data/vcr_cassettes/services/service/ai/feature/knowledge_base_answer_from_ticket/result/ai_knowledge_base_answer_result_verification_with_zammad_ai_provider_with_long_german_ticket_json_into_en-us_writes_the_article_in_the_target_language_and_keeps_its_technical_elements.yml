      string: '[{"model":"mistral-small3.2:24b","created_at":"2026-10-23 13:16:48
        UTC","response":"{\n  \"title\": \"SSO login redirects in a loop after identity
        provider migration\",\n  \"category_id\": 1,\n  \"body\": \"<p>After migrating
        to a new identity provider for Single Sign-On (SSO), users are redirected
        in a loop when attempting to log in. They are successfully authenticated by
        the identity provider but returned to the helpdesk login page, restarting
        the process. Password-based login for administrators continues to work.</p><h3>Cause</h3><p>The
        identity provider was configured with an HTTP redirect URL, but the helpdesk
        only operates over HTTPS. This mismatch prevents the session cookie from being
        set, causing the login process to repeat.</p><h3>Resolution</h3><p>Update
        the redirect URL in the identity provider''s application settings to match
        the helpdesk''s callback URL exactly, ensuring it starts with <strong>https://</strong>.</p><ul><li>Log
        in to your identity provider''s admin console.</li><li>Navigate to the application
        settings for your helpdesk integration.</li><li>Update the redirect URL to
        use <strong>https://</strong>.</li><li>Save the changes.</li><li>Test the
        SSO login in a private browser window.</li></ul><h3>Additional steps</h3><p>If
        some users still experience issues after the redirect URL is corrected, they
        should clear their browser cookies for the helpdesk domain and attempt to
        log in again.</p>\"\n}","usage":{"prompt_tokens":2338,"total_tokens":2652,"completion_tokens":314,"prompt_tokens_details":null},"done":true,"uuid":"ea7bade0-0792-4280-840c-9d452e7bb64e"}]'
