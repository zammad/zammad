name: "zammad-devcontainer"

include: [../default/compose.yaml]

services:
  ldap:
    build: ./ldap
    # Shares the network namespace of the devcontainer, so the directory answers on
    # localhost:389 and localhost:636 there and VS Code forwards the ports like the others.
    network_mode: service:devcontainer
    depends_on:
      - devcontainer
    environment:
      LDAP_BASE_DN: dc=foo,dc=example,dc=com
      LDAP_ADMIN_DN: cn=admin,dc=foo,dc=example,dc=com
      LDAP_ADMIN_PASSWORD: test
      LDAP_DISALLOW_BIND_ANON: "false"
    volumes:
      - ./ldap/certs:/certs
    restart: unless-stopped
