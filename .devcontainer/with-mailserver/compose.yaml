name: "zammad-devcontainer"

include: [../default/compose.yaml]

services:
  mailserver-init:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    entrypoint: ["/bin/sh", "-c", "sh /tmp/docker-mailserver/scripts/init-mailserver.sh"]
    environment:
      ACCOUNT_PROVISIONER: FILE
    volumes:
      - ./scripts:/tmp/docker-mailserver/scripts:ro
      - ./certs:/tmp/docker-mailserver/certs
      - mailserver-config:/tmp/docker-mailserver
    restart: no

  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    # Shares the network namespace of the devcontainer, so the mail ports answer on localhost
    # there and VS Code forwards them like the others. A container in this mode cannot set its
    # own hostname, hence OVERRIDE_HOSTNAME below.
    network_mode: service:devcontainer
    environment:
      SSL_TYPE: manual
      SSL_CERT_PATH: /tmp/docker-mailserver/certs/mail.test.local.crt
      SSL_KEY_PATH: /tmp/docker-mailserver/certs/mail.test.local.key
      ENABLE_IMAP: "1"
      ENABLE_POP3: "1"
      DMS_DEBUG: "0"
      ONE_DIR: "1"
      POSTMASTER_ADDRESS: postmaster@test.local
      OVERRIDE_HOSTNAME: mail.test.local
      ACCOUNT_PROVISIONER: FILE
    depends_on:
      devcontainer:
        condition: service_started
      mailserver-init:
        condition: service_completed_successfully
    volumes:
      - ./certs:/tmp/docker-mailserver/certs
      - mailserver-config:/tmp/docker-mailserver
    restart: unless-stopped

volumes:
  mailserver-config:
    driver: local
