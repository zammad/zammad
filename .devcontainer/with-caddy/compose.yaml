name: "zammad-devcontainer"

include: [../default/compose.yaml]

services:
  caddy:
    image: caddy:2.11.7-alpine
    # Shares the network namespace of the devcontainer: the dev services keep listening on
    # localhost only, and the proxy answers on localhost:8080 inside the devcontainer, which
    # VS Code forwards to the host like the other ports.
    network_mode: service:devcontainer
    depends_on:
      - devcontainer
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
