---
name: "Update Zammad dependencies via updatecli"

sources:
  heroku-buildpack-nodejs:
    name: heroku-buildpack-nodejs
    kind: gittag
    spec:
      url: "https://github.com/heroku/heroku-buildpack-nodejs.git"
      versionfilter:
        kind: "semver"
  heroku-buildpack-ruby:
    name: heroku-buildpack-ruby
    kind: gitbranch
    spec:
      url: "https://github.com/pkgr/heroku-buildpack-ruby.git"
      versionfilter:
        kind: "regex"
        pattern: 'v\d{3}-\d+'
  syft:
    name: syft
    kind: gittag
    spec:
      url: "https://github.com/anchore/syft.git"
      versionfilter:
        kind: "semver"
    transformers:
      - trimprefix: "v"
  syft-sha256:
    name: syft-sha256
    kind: file
    dependson:
      - syft
    spec:
      file: 'https://github.com/anchore/syft/releases/download/v{{ source `syft` }}/syft_{{ source `syft` }}_checksums.txt'
      matchpattern: '[0-9a-f]{64}  syft_[^ ]+_linux_amd64\.tar\.gz'
    transformers:
      - findsubmatch:
          pattern: '^([0-9a-f]{64})'
          captureindex: 1

conditions: {}

targets:
  buildpacks-nodejs:
    name: buildpacks-nodejs
    kind: file
    sourceid: heroku-buildpack-nodejs
    # {{ if .gitlab.enabled }}
    scmid: zammad
    # {{ end }}
    spec:
      file: .buildpacks
      matchpattern: 'https://github.com/heroku/heroku-buildpack-nodejs.git#.*'
      replacepattern: 'https://github.com/heroku/heroku-buildpack-nodejs.git#{{ source `heroku-buildpack-nodejs` }}'
  buildpacks-ruby:
    name: buildpacks-ruby
    kind: file
    sourceid: heroku-buildpack-ruby
    # {{ if .gitlab.enabled }}
    scmid: zammad
    # {{ end }}
    spec:
      file: .buildpacks
      matchpattern: 'https://github.com/pkgr/heroku-buildpack-ruby.git#.*'
      replacepattern: 'https://github.com/pkgr/heroku-buildpack-ruby.git#{{ source `heroku-buildpack-ruby` }}'
  packager-io-syft-version:
    name: packager-io-syft-version
    kind: file
    sourceid: syft
    # {{ if .gitlab.enabled }}
    scmid: zammad
    # {{ end }}
    spec:
      file: contrib/packager.io/after.sh
      matchpattern: 'SYFT_VERSION=.*'
      replacepattern: 'SYFT_VERSION={{ source `syft` }}'
  packager-io-syft-sha256:
    name: packager-io-syft-sha256
    kind: file
    sourceid: syft-sha256
    # {{ if .gitlab.enabled }}
    scmid: zammad
    # {{ end }}
    spec:
      file: contrib/packager.io/after.sh
      matchpattern: 'SYFT_SHA256=.*'
      replacepattern: 'SYFT_SHA256={{ source `syft-sha256` }}'
  docker-syft-version:
    name: docker-syft-version
    kind: file
    sourceid: syft
    # {{ if .gitlab.enabled }}
    scmid: zammad
    # {{ end }}
    spec:
      file: Dockerfile
      matchpattern: 'ARG SYFT_VERSION=.*'
      replacepattern: 'ARG SYFT_VERSION={{ source `syft` }}'

# {{ if .gitlab.enabled }}
scms:
  zammad:
    kind: "gitlab"
    spec:
      url: '{{ requiredEnv "CI_SERVER_URL" }}'
      owner: "zammad"
      repository: "zammad"
      token: '{{ requiredEnv "RENOVATE_TOKEN" }}'
      username: 'renovate'
      branch: "develop"
      workingbranchprefix: "private/updatecli"
      workingbranchseparator: "/"

actions:
  gitlab:
    kind: gitlab/mergerequest
    scmid: zammad
    spec:
      automerge: false
      title: "Maintenance: Update Zammad dependencies via updatecli"
      assignees:
        - 115 # fl
      labels:
        - "dependencies"
# {{ end }}
