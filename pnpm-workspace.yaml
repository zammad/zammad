allowBuilds:
  core-js-pure: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.0'
  - '@vitest/spy@5.0.0'
  - vitest@5.0.0
  - '@vue/apollo-composable@5.0.0-beta.1'
  - '@graphql-codegen/near-operation-file-preset@6.0.0'
  - '@graphql-codegen/typescript-vue-apollo@6.0.0'
overrides:
  '@sa11y/vitest>vitest': ^5.1.0
  'lightningcss': ^1.33.0
permissions:
  '@apollo/client':
    skills: false
  fallow:
    skills: false
verifyDepsBeforeRun: false
peerDependencyRules:
  allowedVersions:
    # @vue/apollo-composable 5.0.0-beta.1 declares @vueuse/core ^14; the repo is on 15.
    '@vue/apollo-composable>@vueuse/core': '15'
